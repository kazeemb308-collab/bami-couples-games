<style>
:root{--bg:#08130f;--panel:#101f18;--panel2:#172920;--line:#294235;--green:#b9f36b;--muted:#9aafa2;--white:#f4f8f4;--red:#ff7777;--gold:#f5ce70}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#1b3025;color:var(--white);padding:11px 14px;font-weight:700}button:active{transform:scale(.98)}button.primary{background:var(--green);border-color:var(--green);color:#102016}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1180px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.7px}.crest{width:42px;height:46px;display:grid;place-items:center;background:var(--green);color:#0a1a11;clip-path:polygon(8% 0,92% 0,88% 70%,50% 100%,12% 70%);font-weight:1000}.season-chip{color:var(--green);font-size:12px;background:#1b3025;padding:8px 10px;border-radius:99px;white-space:nowrap}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}.nav{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;height:max-content;position:sticky;top:10px}.nav button{width:100%;text-align:left;background:transparent;border-color:transparent;margin:2px 0;color:var(--muted)}.nav button.active{background:#20392a;color:var(--green);border-color:#355b3e}.nav .navlabel{font-size:10px;color:#789082;letter-spacing:1.5px;padding:12px 10px 5px}.main{min-width:0}.welcome{background:linear-gradient(120deg,#1b3d2a,#12271c 65%,#1c3024);border:1px solid #35573c;border-radius:20px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}.welcome:after{content:"⚽";position:absolute;right:16px;bottom:-28px;font-size:120px;opacity:.09}.eyebrow{color:var(--green);font-size:11px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase}.welcome h1{font-size:clamp(25px,4vw,39px);letter-spacing:-1.3px;line-height:1.1;margin:10px 0}.welcome p{color:#c2d6c7;max-width:560px;line-height:1.5;margin:0 0 17px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:clamp(17px,2.5vw,25px);margin-top:6px;letter-spacing:-.6px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 12px}.sectionhead h2{font-size:18px;margin:0;letter-spacing:-.4px}.sectionhead p{font-size:12px;color:var(--muted);margin:5px 0 0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card h3{margin:0 0 10px;font-size:15px}.clubrow{display:flex;align-items:center;gap:12px}.badgecrest{width:46px;height:48px;display:grid;place-items:center;flex-shrink:0;border-radius:13px;background:#243c2b;font-size:24px}.clubrow strong{display:block}.clubrow small{color:var(--muted)}.pill{display:inline-block;border-radius:99px;background:#22372a;color:var(--green);padding:5px 8px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;flex-wrap:wrap;gap:8px}.list{display:flex;flex-direction:column;gap:8px}.listitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #23392c}.listitem:last-child{border-bottom:0}.listitem .name{font-weight:750;font-size:13px}.listitem small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.rating{color:var(--green);font-weight:900}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:490px;font-size:12px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;background:#14251b}td,th{padding:11px 10px;border-bottom:1px solid #23392c}tr:last-child td{border-bottom:0}tr.you td{background:#1c3425;color:var(--green)}.pitch{position:relative;width:100%;aspect-ratio:1.65;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(90deg,#24623e 0,#24623e 12.5%,#2a6b44 12.5%,#2a6b44 25%);border:2px solid #7fba83;touch-action:manipulation}.pitch:before{content:"";position:absolute;inset:5%;border:1.5px solid #d3efd0a8}.halfway{position:absolute;left:50%;top:5%;bottom:5%;border-left:1.5px solid #d3efd0a8}.circle{position:absolute;left:50%;top:50%;width:20%;aspect-ratio:1;transform:translate(-50%,-50%);border:1.5px solid #d3efd0a8;border-radius:50%}.boxleft,.boxright{position:absolute;top:27%;height:46%;width:13%;border:1.5px solid #d3efd0a8}.boxleft{left:5%}.boxright{right:5%}.playerdot{position:absolute;transform:translate(-50%,-50%);width:clamp(20px,3.2vw,30px);height:clamp(20px,3.2vw,30px);border-radius:50%;display:grid;place-items:center;background:#e9f5e7;color:#14331f;border:2px solid white;font-size:9px;font-weight:1000;box-shadow:0 2px 5px #0006;z-index:2}.playerdot.opp{background:#ef7777;color:#fff;border-color:#ffd5d5}.ball{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:white;border:2px solid #222;z-index:4;box-shadow:0 1px 5px #0008;transition:left .45s linear,top .45s linear}.scoreboard{display:flex;justify-content:space-between;align-items:center;background:#08140e;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}.score{font-size:25px;font-weight:1000;letter-spacing:2px}.commentary{max-height:210px;overflow:auto;background:#0b1811;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;line-height:1.55}.commentary p{margin:0;padding:7px 0;border-bottom:1px solid #1e3326}.commentary p:last-child{border:0}.commentary .event{color:var(--green);font-weight:800}.field{width:100%;background:#09160f;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--white);margin:6px 0 12px}.formlabel{font-size:12px;color:var(--muted);display:block}.playergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.playercard{background:#15261b;border:1px solid var(--line);border-radius:12px;padding:10px}.playercard strong{font-size:12px;display:block}.playercard small{color:var(--muted);font-size:10px}.playercard select{width:100%;margin-top:7px;background:#09160f;color:white;border:1px solid var(--line);padding:7px;border-radius:8px;font-size:11px}.empty{text-align:center;padding:40px 18px;color:var(--muted)}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;background:var(--green);color:#102016;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:850;box-shadow:0 8px 30px #0008;max-width:90%;text-align:center}.hidden{display:none!important}.footer{padding:24px 0 8px;text-align:center;color:#6f8878;font-size:11px}.smallbtn{padding:7px 9px;font-size:11px}.danger{color:var(--red)}@media(max-width:720px){.app{padding:12px}.layout{display:flex;flex-direction:column;gap:12px}.nav{position:sticky;top:0;z-index:10;display:flex;overflow-x:auto;gap:5px;padding:7px;border-radius:13px;white-space:nowrap;scrollbar-width:none}.nav .navlabel{display:none}.nav button{width:auto;flex-shrink:0;margin:0;padding:10px 12px;font-size:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:12px}.welcome{padding:18px}.grid2{grid-template-columns:1fr}.playergrid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{margin-bottom:12px}.scoreboard{padding:10px}.pitch{aspect-ratio:1.25}.brand{font-size:18px}}@media(min-width:900px){.app{padding:24px}.welcome{padding:28px}}
</style>

<body><div class="app">
<header class="top"><div class="brand"><div class="crest">T</div><div>TOUCHLINE <span style="color:var(--green)">FM</span><div style="font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1.2px">YOUR CLUB. YOUR LEGACY.</div></div></div><div class="season-chip" id="seasonChip">2026/27 SEASON</div></header>
<div id="setup" class="card hidden"></div>
<div id="game" class="layout hidden"><nav class="nav" id="nav"><div class="navlabel">MANAGEMENT</div><button data-page="dashboard" class="active">⌂ Overview</button><button data-page="squad">♙ Squad</button><button data-page="tactics">⚽ Tactics</button><button data-page="fixtures">▦ Fixtures</button><button data-page="league">☷ League table</button><div class="navlabel">CLUB BUSINESS</div><button data-page="transfers">⇄ Transfers</button><button data-page="club">◆ Club & career</button></nav><main class="main" id="main"></main></div>
<div class="footer">TOUCHLINE FM · A fan-made football management game · Career saves stay on this device</div></div><div id="toast" class="toast hidden"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'£'+Math.round(n).toLocaleString('en-GB');
const positions=['GK','RB','CB','CB','LB','DM','CM','CM','RW','ST','LW'];
const clubs=[
{name:'Arsenal',short:'ARS',rating:83,budget:72,emoji:'🔴',league:'Premier League'},{name:'Manchester City',short:'MCI',rating:88,budget:110,emoji:'🔵',league:'Premier League'},{name:'Liverpool',short:'LIV',rating:85,budget:80,emoji:'🔴',league:'Premier League'},{name:'Chelsea',short:'CHE',rating:81,budget:75,emoji:'🔵',league:'Premier League'},{name:'Manchester United',short:'MUN',rating:80,budget:70,emoji:'🔴',league:'Premier League'},{name:'Tottenham',short:'TOT',rating:79,budget:55,emoji:'⚪',league:'Premier League'},{name:'Newcastle United',short:'NEW',rating:80,budget:60,emoji:'⚫',league:'Premier League'},{name:'Aston Villa',short:'AVL',rating:79,budget:48,emoji:'🟣',league:'Premier League'},{name:'Real Madrid',short:'RMA',rating:89,budget:120,emoji:'⚪',league:'La Liga'},{name:'Barcelona',short:'BAR',rating:86,budget:65,emoji:'🔵',league:'La Liga'},{name:'Atlético Madrid',short:'ATM',rating:83,budget:48,emoji:'🔴',league:'La Liga'},{name:'Bayern Munich',short:'BAY',rating:87,budget:95,emoji:'🔴',league:'Bundesliga'},{name:'Borussia Dortmund',short:'BVB',rating:81,budget:45,emoji:'🟡',league:'Bundesliga'},{name:'Inter Milan',short:'INT',rating:85,budget:70,emoji:'⚫',league:'Serie A'},{name:'AC Milan',short:'MIL',rating:82,budget:55,emoji:'🔴',league:'Serie A'},{name:'Juventus',short:'JUV',rating:82,budget:52,emoji:'⚫',league:'Serie A'},{name:'Paris Saint-Germain',short:'PSG',rating:86,budget:100,emoji:'🔵',league:'Ligue 1'},{name:'Napoli',short:'NAP',rating:81,budget:45,emoji:'🔵',league:'Serie A'},{name:'Brighton',short:'BHA',rating:77,budget:38,emoji:'🔵',league:'Premier League'},{name:'West Ham',short:'WHU',rating:76,budget:35,emoji:'🍷',league:'Premier League'}];
const first=['Alex','Daniel','Marcus','Jordan','Samuel','Ethan','Noah','Luca','Mason','Oliver','Kai','Rafael','Victor','Theo','Leo','Gabriel','Adam','David','Tariq','Emmanuel','Chidi','Ibrahim','Mateo','Jayden','Tunde','Kylian','Bruno','Oscar','Nathan','Felix'];
const last=['Morgan','Silva','Williams','Johnson','Okafor','Martin','Brown','Costa','James','Wilson','Bello','Adeyemi','Santos','Mendy','Diallo','Clarke','Rossi','Fernandez','Adebayo','Nwosu','Muller','Young','King','Walker','Evans','Garcia','Kane','Pereira'];
let state=null,page='dashboard',matchTimer=null,toastTimer=null;
function makePlayers(team,rating){let out=[];for(let i=0;i<18;i++){let pos=positions[i<11?i:[0,2,3,5,6,7,8,9,10,1,4,5,6,7,8,9,2,3][i-11]],ovr=Math.max(49,Math.min(94,Math.round(rating+(Math.random()*15-7)-(i>10?3:0))));out.push({id:team.short+'-'+i,name:first[Math.floor(Math.random()*first.length)]+' '+last[Math.floor(Math.random()*last.length)],pos,ovr,age:18+Math.floor(Math.random()*17),value:Math.round((ovr-42)**2*0.018+Math.random()*3),wage:Math.round(ovr*1.15),goals:0,apps:0})}return out}
function newCareer(team,customName){let user={...team,name:customName||team.name,short:(customName||team.name).replace(/[^A-Z]/gi,'').slice(0,3).toUpperCase()||'CUS',emoji:team.emoji||'🟢',rating:team.rating,budget:team.budget,league:team.league||'Premier League',isCustom:!!customName};let rivals=clubs.filter(c=>c.name!==team.name&&c.league===user.league).slice(0,9);if(rivals.length<5)rivals=clubs.filter(c=>c.name!==team.name).slice(0,9);let teams=[user,...rivals].map(c=>({...c,players:makePlayers(c,c.rating),points:0,played:0,w:0,d:0,l:0,gf:0,ga:0}));let me=teams[0];state={version:1,manager:'Manager',club:me.short,teams,players:me.players,budget:me.budget*1000000,wageBudget:Math.round(me.rating*15000),season:2026,week:1,playedMatches:[],history:[],formation:'4-3-3',mentality:'Balanced',style:'Wing play',lastResult:null,transfers:[],customClubs:[],news:[],saveTime:Date.now()};state.fixtures=makeFixtures(teams.map(t=>t.short));state.table=teams.map(t=>({short:t.short,name:t.name,emoji:t.emoji,rating:t.rating,points:0,played:0,w:0,d:0,l:0,gf:0,ga:0}));save();$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}
function makeFixtures(ids){let list=[];let arr=ids.slice();if(arr.length%2)arr.push('BYE');let n=arr.length;for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];if(a!=='BYE'&&b!=='BYE'){let home=r%2===0?a:b,away=r%2===0?b:a;list.push({week:r+1,home,away,done:false,hs:null,as:null})}}let fixed=arr[0];let rest=arr.slice(1);rest.unshift(rest.pop());arr=[fixed,...rest]}let first=list.slice();first.forEach(f=>list.push({week:f.week+n-1,home:f.away,away:f.home,done:false,hs:null,as:null}));return list}
function save(){if(state){state.saveTime=Date.now();try{localStorage.setItem('touchline-career-v1',JSON.stringify(state))}catch(e){}}}
function load(){try{let s=JSON.parse(localStorage.getItem('touchline-career-v1'));if(s&&s.version===1&&s.players&&s.teams){state=s;return true}}catch(e){}return false}
function myTeam(){return state.teams.find(t=>t.short===state.club)||state.teams[0]}
function getTeam(id){return state.teams.find(t=>t.short===id)}
function myPlayers(){return state.players}
function showToast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function pageTitle(title,sub,action){return '<div class="sectionhead"><div><h2>'+title+'</h2><p>'+sub+'</p></div>'+(action||'')+'</div>'}
function stat(label,val,sub){return '<div class="stat"><small>'+label+'</small><strong>'+val+'</strong>'+(sub?'<small>'+sub+'</small>':'')+'</div>'}
function clubBadge(t){return '<div class="clubrow"><div class="badgecrest">'+esc(t.emoji||'⚽')+'</div><div><strong>'+esc(t.name)+'</strong><small>'+esc(t.league||'Custom club')+' · '+t.rating+' OVR</small></div></div>'}
function matchOfWeek(){return state.fixtures.find(f=>f.week===state.week&&!f.done&&(f.home===state.club||f.away===state.club))}
function render(){if(!state){showSetup();return}$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('seasonChip').textContent=state.season+'/'+String((state.season+1)%100).padStart(2,'0')+' SEASON';document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const views={dashboard:dashboard,squad:squadPage,tactics:tacticsPage,fixtures:fixturesPage,league:leaguePage,transfers:transfersPage,club:clubPage};$('main').innerHTML=(views[page]||dashboard)();bind()}
function showSetup(){ $('game').classList.add('hidden');$('setup').classList.remove('hidden');$('setup').innerHTML='<div class="eyebrow">NEW CAREER · 2026/27</div><h1 style="font-size:32px;letter-spacing:-1px">Your story starts here.</h1><p class="muted">Choose your club, take charge of the dressing room and build a legacy over multiple seasons.</p><label class="formlabel" for="managerName">Manager name</label><input id="managerName" class="field" placeholder="Your name" maxlength="32" value="Manager"><label class="formlabel" for="clubSelect">Choose a real club</label><select id="clubSelect" class="field">'+clubs.map((c,i)=>'<option value="'+i+'">'+c.emoji+' '+esc(c.name)+' · '+c.league+' · '+c.rating+' OVR</option>').join('')+'</select><div class="grid2"><div><label class="formlabel" for="customClub">Or create a custom club</label><input id="customClub" class="field" placeholder="e.g. Ilesa United" maxlength="32"></div><div><label class="formlabel" for="customRating">Custom club level</label><select id="customRating" class="field"><option value="65">Developing · 65 OVR</option><option value="72" selected>Competitive · 72 OVR</option><option value="80">Elite · 80 OVR</option></select></div></div><button class="primary" id="startCareer" style="width:100%;padding:15px">Start my career →</button><p class="muted" style="font-size:11px;margin-top:12px">Includes a playable league, squad management, transfers, tactics, match simulation and local career saves.</p>'; $('startCareer').onclick=()=>{let c=clubs[+$('clubSelect').value],custom=$('customClub').value.trim();if(custom){let r=+$('customRating').value;c={name:custom,short:custom.replace(/[^a-z]/gi,'').slice(0,3).toUpperCase()||'CUS',rating:r,budget:r===80?55:r===72?25:8,emoji:'🟢',league:'Custom League'}}newCareer(c,custom);state.manager=$('managerName').value.trim()||'Manager';save();render()}}
function dashboard(){let t=myTeam(),f=matchOfWeek(),done=state.playedMatches.length,rank=state.table.slice().sort(sortTable).findIndex(x=>x.short===state.club)+1;return '<div class="welcome"><div class="eyebrow">MANAGER DESK · '+state.season+'/'+String((state.season+1)%100).padStart(2,'0')+'</div><h1>Welcome back,<br>'+esc(state.manager)+'.</h1><p>Every match is a chance to make history. The board expects progress — your next decision is yours to make.</p><div class="actions"><button class="primary" data-goto="fixtures">View next match →</button><button data-goto="tactics">Set tactics</button></div></div><div class="stats">'+stat('LEAGUE POSITION',rank?('#'+rank):'—',t.league)+stat('TRANSFER BUDGET',money(state.budget/1000000)+'m','Available funds')+stat('MATCHES PLAYED',done,'This season')+stat('SQUAD SIZE',state.players.length,'First-team players')+'</div>'+pageTitle('Next fixture','Your next competitive match',f?'<button class="primary" data-play="'+state.fixtures.indexOf(f)+'">Play match ⚽</button>':'<button class="primary" data-nextseason>Start next season</button>')+'<div class="card">'+(f?'<div class="row">'+clubBadge(getTeam(f.home))+'<div style="text-align:center"><div class="muted" style="font-size:11px">MATCHWEEK '+f.week+'</div><div style="font-weight:1000;font-size:23px">VS</div><small class="muted">90 minutes</small></div>'+clubBadge(getTeam(f.away))+'</div>':'<div class="empty">All fixtures completed. Ready for the next season?</div>')+'</div><div class="grid2">'+pageTitle('Club pulse','Latest from your career')+'<div class="card"><h3>Board confidence</h3><div class="row"><strong>'+boardConfidence()+'%</strong><span class="pill">'+(boardConfidence()>70?'Supportive':boardConfidence()>45?'Watching':'Under pressure')+'</span></div><div style="height:7px;background:#263a2d;border-radius:99px;margin-top:12px;overflow:hidden"><div style="height:100%;width:'+boardConfidence()+'%;background:var(--green);border-radius:99px"></div></div><p class="muted" style="font-size:12px">Win matches and manage your budget to keep the board on your side.</p></div><div class="card"><h3>Latest result</h3>'+(state.lastResult?'<div class="row"><span>'+esc(state.lastResult.homeName)+'<br><small class="muted">'+esc(state.lastResult.competition)+'</small></span><strong style="font-size:22px">'+state.lastResult.hs+' - '+state.lastResult.as+'</strong><span>'+esc(state.lastResult.awayName)+'</span></div>':'<p class="muted">Your first result is waiting to be written.</p>')+'</div></div>'+pageTitle('Quick actions','Manage the important details')+'<div class="grid2"><div class="card"><h3>🧠 Tactical board</h3><p class="muted" style="font-size:12px">Choose your shape, mentality and playing style before kickoff.</p><button data-goto="tactics">Open tactics</button></div><div class="card"><h3>🔎 Recruitment room</h3><p class="muted" style="font-size:12px">Find players to improve your squad and spend within your budget.</p><button data-goto="transfers">Browse transfers</button></div></div>'}
function boardConfidence(){let p=state.table.find(t=>t.short===state.club);return Math.max(20,Math.min(98,64+(p?p.w*4-p.l*3:0)-(state.budget<0?15:0)))}
function sortTable(a,b){return b.points-a.points||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||b.rating-a.rating}
function leaguePage(){let rows=state.table.slice().sort(sortTable),t=myTeam();return pageTitle('League table',t.league+' · Season '+state.season+'/'+(state.season+1))+'<div class="card" style="margin-bottom:12px"><div class="row"><div><div class="eyebrow">COMPETITION</div><h3 style="margin:5px 0">'+esc(t.league)+'</h3></div><span class="pill">'+rows.length+' CLUBS</span></div><p class="muted" style="font-size:12px">Ranked by points, goal difference, then goals scored. Teams play home and away.</p></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Club</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr class="'+(r.short===state.club?'you':'')+'"><td>'+(i+1)+'</td><td>'+esc(r.emoji)+' '+esc(r.name)+(r.short===state.club?' ★':'')+'</td><td>'+r.played+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+r.gf+'</td><td>'+r.ga+'</td><td>'+(r.gf-r.ga>0?'+':'')+(r.gf-r.ga)+'</td><td><strong>'+r.points+'</strong></td></tr>').join('')+'</tbody></table></div><p class="muted" style="font-size:11px;margin-top:10px">★ Your club · Simulated results are saved automatically.</p>'}
function fixturesPage(){let mine=state.fixtures.filter(f=>f.home===state.club||f.away===state.club),done=mine.filter(f=>f.done).length;return pageTitle('Fixtures & results',done+' of '+mine.length+' matches completed')+'<div class="list">'+mine.map(f=>{let idx=state.fixtures.indexOf(f),home=getTeam(f.home),away=getTeam(f.away),isNext=!f.done&&f.week===state.week;return '<div class="card"><div class="row"><span class="pill">MW '+f.week+'</span><span class="muted" style="font-size:11px">'+(f.done?'FULL TIME':isNext?'NEXT MATCH':'UPCOMING')+'</span></div><div class="row" style="margin:12px 0"><div style="flex:1">'+esc(home.emoji)+' '+esc(home.name)+'</div><strong style="font-size:20px;min-width:70px;text-align:center">'+(f.done?f.hs+' - '+f.as:'vs')+'</strong><div style="flex:1;text-align:right">'+esc(away.name)+' '+esc(away.emoji)+'</div></div>'+(f.done?'<small class="muted">Match report available in career history.</small>':isNext?'<button class="primary smallbtn" data-play="'+idx+'">Play match</button>':'<small class="muted">Complete earlier matchweeks to progress.</small>')+'</div>'}).join('')+'</div>'}
function squadPage(){let sorted=state.players.slice().sort((a,b)=>positions.indexOf(a.pos)-positions.indexOf(b.pos));return pageTitle('First-team squad',state.players.length+' players · Average rating '+Math.round(state.players.reduce((s,p)=>s+p.ovr,0)/state.players.length))+'<div class="playergrid">'+sorted.map(p=>'<div class="playercard"><div class="row"><span class="pill">'+p.pos+'</span><span class="rating">'+p.ovr+'</span></div><strong style="margin-top:8px">'+esc(p.name)+'</strong><small>Age '+p.age+' · Value '+money(p.value)+'m</small><small>Wage '+money(p.wage)+'/wk · '+p.apps+' apps · '+p.goals+' goals</small><div class="row" style="margin-top:8px"><button class="smallbtn" data-train="'+p.id+'">Train +1</button><span class="muted" style="font-size:10px">'+(p.age<22?'Wonderkid':p.ovr>85?'Star':'First team')+'</span></div></div>').join('')+'</div><p class="muted" style="font-size:11px;margin-top:12px">Training costs £25,000 per player and improves their rating by one, up to 95.</p>'}
function tacticsPage(){let eleven=state.players.slice(0,11),formation=state.formation;return pageTitle('Tactical board','Shape your team before the next match')+'<div class="grid2"><div class="card"><label class="formlabel">Formation</label><select id="formation" class="field">'+['4-3-3','4-2-3-1','4-4-2','3-5-2','5-3-2'].map(x=>'<option '+(formation===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label class="formlabel">Team mentality</label><select id="mentality" class="field">'+['Very defensive','Defensive','Balanced','Attacking','All out attack'].map(x=>'<option '+(state.mentality===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label class="formlabel">Playing style</label><select id="style" class="field">'+['Wing play','Possession','Counter attack','High press','Direct football'].map(x=>'<option '+(state.style===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button id="saveTactics" class="primary" style="width:100%">Save tactical plan</button><p class="muted" style="font-size:11px">Your mentality and style affect match simulation outcomes.</p></div><div class="card"><h3>Starting XI</h3><p class="muted" style="font-size:11px">Select players for each role.</p>'+eleven.map((p,i)=>'<div class="listitem"><div><span class="pill">'+positions[i]+'</span> <span class="name">'+esc(p.name)+'</span><small>Rating '+p.ovr+'</small></div><select class="field" style="width:82px;padding:7px;margin:0" data-role="'+p.id+'">'+['GK','RB','CB','LB','DM','CM','AM','RW','LW','ST'].map(pos=>'<option '+(p.pos===pos?'selected':'')+'>'+pos+'</option>').join('')+'</select></div>').join('')+'</div></div><div class="sectionhead"><div><h2>Formation preview</h2><p>Live tactical shape · green shirts are your players</p></div></div>'+renderPitchPreview(eleven)}
function renderPitchPreview(players){let coords=formationCoords(state.formation),dots=players.slice(0,11).map((p,i)=>'<div class="playerdot" style="left:'+coords[i][0]+'%;top:'+coords[i][1]+'%" title="'+esc(p.name)+'">'+(i===0?'GK':p.pos)+'</div>').join('');return '<div class="pitch">'+ '<div class="halfway"></div><div class="circle"></div><div class="boxleft"></div><div class="boxright"></div>'+dots+'</div>'}
function formationCoords(f){if(f==='4-2-3-1')return [[8,50],[25,16],[25,39],[25,61],[25,84],[43,38],[43,62],[61,18],[61,50],[61,82],[81,50]];if(f==='4-4-2')return [[8,50],[25,16],[25,39],[25,61],[25,84],[48,15],[48,38],[48,62],[48,85],[78,35],[78,65]];if(f==='3-5-2')return [[8,50],[25,25],[25,50],[25,75],[48,10],[48,30],[48,50],[48,70],[48,90],[78,38],[78,62]];if(f==='5-3-2')return [[8,50],[25,10],[25,30],[25,50],[25,70],[25,90],[49,25],[49,50],[49,75],[78,38],[78,62]];return [[8,50],[25,15],[25,38],[25,62],[25,85],[48,28],[48,50],[48,72],[70,15],[80,50],[70,85]]}
function transfersPage(){let market=state.market||(state.market=clubs.filter(c=>c.name!==myTeam().name).flatMap(c=>makePlayers(c,c.rating).slice(0,2).map(p=>({...p,club:c.name,clubShort:c.short,fee:Math.round(p.value*(0.7+Math.random()*.65))}))));return pageTitle('Transfer market','Recruit talent · Budget '+money(state.budget/1000000)+'m','<button id="refreshMarket">Refresh scouting</button>')+'<div class="card" style="margin-bottom:12px"><div class="row"><div><small class="muted">TRANSFER BUDGET</small><h2 style="margin:4px 0">'+money(state.budget/1000000)+'m</h2></div><span class="pill">SCOUTING NETWORK</span></div><p class="muted" style="font-size:12px">Sign players to strengthen your team. Transfer fees are paid from your budget; incoming players join your squad.</p></div><div class="list">'+market.slice(0,32).map(p=>'<div class="card"><div class="row"><div><div class="name">'+esc(p.name)+' <span class="rating">'+p.ovr+'</span></div><small class="muted">'+p.pos+' · Age '+p.age+' · '+esc(p.club||'Free agent')+'</small></div><div style="text-align:right"><strong>'+money(p.fee||p.value)+'m</strong><small class="muted" style="display:block">Wage '+money(p.wage)+'/wk</small></div></div><div class="row" style="margin-top:10px"><small class="muted">Potential '+Math.min(96,p.ovr+Math.floor(Math.random()*8))+'</small><button class="primary smallbtn" data-buy="'+p.id+'">Sign player</button></div></div>').join('')+'</div>'}
function clubPage(){let t=myTeam(),h=state.history.slice(-8).reverse();return pageTitle('Club & career','Build a legacy beyond this season')+'<div class="card"><div class="row">'+clubBadge(t)+'<span class="pill">'+(t.isCustom?'CUSTOM CLUB':'CLUB')+'</span></div><div class="stats" style="margin-top:16px;margin-bottom:0">'+stat('CLUB RATING',t.rating+'/100','Squad strength')+stat('TRANSFER BUDGET',money(state.budget/1000000)+'m','Available')+stat('WEEKLY WAGES',money(state.players.reduce((a,p)=>a+p.wage,0)),'Current payroll')+stat('SEASONS',state.season-2025,'Career years')+'</div></div>'+pageTitle('Career history','Your recent results')+'<div class="card">'+(h.length?h.map(r=>'<div class="listitem"><div><div class="name">'+esc(r.homeName)+' vs '+esc(r.awayName)+'</div><small>'+esc(r.competition)+' · '+r.season+'/'+(r.season+1)+'</small></div><strong>'+r.hs+' - '+r.as+'</strong></div>').join(''):'<div class="empty">Your history will appear after your first match.</div>')+'</div>'+pageTitle('Save management','Your career is saved on this device')+'<div class="card"><p class="muted" style="font-size:12px">Autosave is active. Your club, players, fixtures, finances and results are stored in this browser.</p><div class="actions"><button id="exportSave">Export career backup</button><button id="newCareer" class="danger">Start a new career</button><input type="file" id="importSave" accept=".json,application/json" class="hidden"></div><button id="importButton" style="margin-top:8px">Import career backup</button></div>'}
function bind(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;render()});document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>startMatch(+b.dataset.play));document.querySelectorAll('[data-nextseason]').forEach(b=>b.onclick=nextSeason);document.querySelectorAll('[data-train]').forEach(b=>b.onclick=()=>trainPlayer(b.dataset.train));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyPlayer(b.dataset.buy));if($('saveTactics'))$('saveTactics').onclick=()=>{state.formation=$('formation').value;state.mentality=$('mentality').value;state.style=$('style').value;document.querySelectorAll('[data-role]').forEach(s=>{let p=state.players.find(p=>p.id===s.dataset.role);if(p)p.pos=s.value});save();showToast('Tactics saved');render()};if($('refreshMarket'))$('refreshMarket').onclick=()=>{state.market=null;save();render();showToast('Scouts have returned with fresh names')};if($('exportSave'))$('exportSave').onclick=exportSave;if($('importButton'))$('importButton').onclick=()=>$('importSave').click();if($('importSave'))$('importSave').onchange=importSave;if($('newCareer'))$('newCareer').onclick=()=>{if(confirm('Start a new career? Export your current save first if you want to keep it.')){localStorage.removeItem('touchline-career-v1');state=null;page='dashboard';showSetup()}}}
function trainPlayer(id){let p=state.players.find(p=>p.id===id);if(!p)return;if(state.budget<25000){showToast('Not enough funds for training');return}if(p.ovr>=95){showToast('Player has reached maximum rating');return}state.budget-=25000;p.ovr++;save();showToast(p.name+' improved to '+p.ovr+' OVR');render()}
function buyPlayer(id){let market=state.market||[],idx=market.findIndex(p=>p.id===id),p=market[idx];if(!p)return;let fee=(p.fee||p.value)*1000000;if(state.players.some(x=>x.name===p.name)){showToast('This player is already in your squad');return}if(state.players.length>=30){showToast('Squad limit reached. Sell a player first.');return}if(state.budget<fee){showToast('Not enough transfer funds');return}if(!confirm('Sign '+p.name+' for '+money(p.fee||p.value)+'m?'))return;state.budget-=fee;state.players.push({...p,id:state.club+'-new-'+Date.now(),club:undefined,clubShort:undefined,fee:undefined,apps:0,goals:0});market.splice(idx,1);myTeam().players=state.players;save();showToast('Transfer complete: '+p.name+' signed!');render()}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='touchline-career-'+state.club+'.json';a.click();URL.revokeObjectURL(url);showToast('Career backup exported')}
function importSave(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let s=JSON.parse(r.result);if(s.version!==1||!s.players||!s.teams||!s.fixtures)throw Error('invalid');state=s;save();render();showToast('Career backup restored')}catch(err){showToast('That save file is not valid')} };r.readAsText(file);e.target.value=''}
function startMatch(idx){let f=state.fixtures[idx];if(!f||f.done){showToast('This match is unavailable');return}if(f.week!==state.week){showToast('Play the next matchweek in order');return}let home=getTeam(f.home),away=getTeam(f.away);let userHome=f.home===state.club;let ourRating=state.players.slice(0,11).reduce((s,p)=>s+p.ovr,0)/11;let oppRating=(userHome?away:home).rating;let ourBoost=(state.mentality==='Attacking'?3:state.mentality==='All out attack'?5:state.mentality==='Defensive'?-2:state.mentality==='Very defensive'?-4:0)+(state.style==='Possession'?2:state.style==='High press'?2:state.style==='Counter attack'?1:0);let oppPower=(userHome?away:home).rating;let homeRating=userHome?ourRating:oppPower,awayRating=userHome?oppPower:ourRating;if(userHome)homeRating+=ourBoost+2;else awayRating+=ourBoost;let hs=0,as=0,events=[],minute=0;let screen='<div class="eyebrow">MATCH DAY · MATCHWEEK '+f.week+'</div><h2 style="margin:8px 0 14px">The tunnel is ready.</h2><div class="scoreboard"><div style="text-align:center;flex:1"><div style="font-size:11px;color:var(--muted)">'+esc(home.name)+'</div><div class="score" id="scoreHome">0</div></div><div style="text-align:center"><span class="pill" id="matchMinute">00:00</span><div class="muted" style="font-size:10px;margin-top:5px">LIVE MATCH</div></div><div style="text-align:center;flex:1"><div style="font-size:11px;color:var(--muted)">'+esc(away.name)+'</div><div class="score" id="scoreAway">0</div></div></div><div class="pitch" id="livePitch"><div class="halfway"></div><div class="circle"></div><div class="boxleft"></div><div class="boxright"></div><div id="livePlayers"></div><div class="ball" id="ball"></div></div><div class="row" style="margin:10px 0"><span class="muted" id="matchStatus" style="font-size:12px">Players are taking their positions...</span><button id="skipMatch">Skip to full time ⏩</button></div><div class="card"><div class="row"><h3 style="margin:0">Live commentary</h3><span class="pill">LIVE</span></div><div class="commentary" id="commentary" style="margin-top:10px"><p>Kick-off is moments away. The referee checks his watch.</p></div></div><div class="actions" style="margin-top:12px"><button id="matchTactics">Change tactics</button><button id="endMatch" disabled>Full-time report</button></div>'; $('main').innerHTML=screen;page='match';document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));$('livePlayers').innerHTML=formationCoords(state.formation).map((c,i)=>'<div class="playerdot '+(i===0?'':'')+'" style="left:'+c[0]+'%;top:'+c[1]+'%">'+(i===0?'GK':positions[i])+'</div>').join('')+Array.from({length:11},(_,i)=>'<div class="playerdot opp" style="left:'+(100-formationCoords('4-3-3')[i][0])+'%;top:'+formationCoords('4-3-3')[i][1]+'%">'+(i===0?'GK':'')+'</div>').join('');$('matchTactics').onclick=()=>{stopMatch();page='tactics';render()};let steps=Array.from({length:19},(_,i)=>i*5);steps.push(90);let cursor=0,finished=false;function finish(){if(finished)return;finished=true;clearInterval(matchTimer);let ourGoals=userHome?hs:as,oppGoals=userHome?as:hs;f.done=true;f.hs=hs;f.as=as;f.homeName=home.name;f.awayName=away.name;state.playedMatches.push(f);let htab=state.table.find(x=>x.short===f.home),atab=state.table.find(x=>x.short===f.away);[htab,atab].forEach(x=>x.played++);htab.gf+=hs;htab.ga+=as;atab.gf+=as;atab.ga+=hs;if(hs>as){htab.w++;htab.points+=3;atab.l++}else if(as>hs){atab.w++;atab.points+=3;htab.l++}else{htab.d++;atab.d++;htab.points++;atab.points++}let my=state.players;my.forEach(p=>p.apps++);let scorers=my.filter(p=>p.pos==='ST'||p.pos==='RW'||p.pos==='LW'||p.pos==='AM');for(let i=0;i<ourGoals&&scorers.length;i++)scorers[Math.floor(Math.random()*scorers.length)].goals++;let result={homeName:home.name,awayName:away.name,hs,as,competition:myTeam().league,season:state.season};state.lastResult=result;state.fixtures.filter(other=>other.week===f.week&&!other.done&&other!==f).forEach(other=>{let ht=getTeam(other.home),at=getTeam(other.away);let hg=Math.max(0,Math.min(5,Math.round(Math.random()*2.1+(ht.rating-at.rating)/22))),ag=Math.max(0,Math.min(5,Math.round(Math.random()*2.1+(at.rating-ht.rating)/22)));other.done=true;other.hs=hg;other.as=ag;other.homeName=ht.name;other.awayName=at.name;let hrow=state.table.find(x=>x.short===other.home),arow=state.table.find(x=>x.short===other.away);hrow.played++;arow.played++;hrow.gf+=hg;hrow.ga+=ag;arow.gf+=ag;arow.ga+=hg;if(hg>ag){hrow.w++;hrow.points+=3;arow.l++}else if(ag>hg){arow.w++;arow.points+=3;hrow.l++}else{hrow.d++;arow.d++;hrow.points++;arow.points++}});state.week=Math.min(state.fixtures.reduce((m,x)=>Math.max(m,x.week),1),f.week+1);state.history.push(result);state.budget+=ourGoals>oppGoals?500000:ourGoals===oppGoals?150000:0;save();$('matchMinute').textContent='FT';$('matchStatus').textContent='Full time — '+(ourGoals>oppGoals?'A massive win!':ourGoals===oppGoals?'Honours even.':'The team will need to respond.');$('endMatch').disabled=false;$('endMatch').textContent='Return to career';$('endMatch').onclick=()=>{page='dashboard';render()};$('skipMatch').disabled=true;$('skipMatch').textContent='FULL TIME';addEvent('FULL TIME: '+home.name+' '+hs+'–'+as+' '+away.name,true);$('scoreHome').textContent=hs;$('scoreAway').textContent=as}
function addEvent(text,important){let p=document.createElement('p');if(important)p.className='event';p.textContent=text;$('commentary').prepend(p)}
function tick(){if(finished)return;if(cursor>=steps.length){finish();return}minute=steps[cursor++];$('matchMinute').textContent=minute+"'";let attackHome=Math.random()<(homeRating/(homeRating+awayRating));let chance=Math.random()<(minute%15===0?.55:.28);let ball=$('ball');ball.style.left=(attackHome?10+Math.random()*36:54+Math.random()*36)+'%';ball.style.top=(16+Math.random()*68)+'%';let names=['plays a sharp pass through midfield','wins the second ball','switches play to the flank','looks for a run in behind','presses high and wins possession','tries to find space between the lines','builds patiently from the back'];let event=minute+"' "+(attackHome?home.name:away.name)+' '+names[Math.floor(Math.random()*names.length)]+'.';if(chance){let shotRating=attackHome?homeRating:awayRating;let goalChance=.10+(shotRating-70)*.003+(attackHome?.025:0);if(Math.random()<goalChance){if(attackHome)hs++;else as++;$('scoreHome').textContent=hs;$('scoreAway').textContent=as;event='⚽ GOAL! '+minute+"' "+(attackHome?home.name:away.name)+' find the net! '+hs+'–'+as+'.';addEvent(event,true)}else if(Math.random()<.5)event=minute+"' "+(attackHome?home.name:away.name)+' fires at goal — the keeper makes the save!';else event=minute+"' A dangerous attack from "+(attackHome?home.name:away.name)+' breaks down at the last moment.'}addEvent(event,false);$('matchStatus').textContent=minute<45?'First half':minute===45?'Half-time':'Second half';if(minute===45)addEvent('HALF-TIME: Managers have 15 minutes to make changes.',true);if(minute===90)finish()}
function stopMatch(){clearInterval(matchTimer)}
$('skipMatch').onclick=()=>{while(!finished&&cursor<steps.length)tick();if(!finished)finish()};$('endMatch').onclick=()=>{if(finished){page='dashboard';render()}};matchTimer=setInterval(tick,1300);tick()}
function nextSeason(){if(state.fixtures.some(f=>!f.done)){showToast('Finish every fixture before starting a new season');return}if(!confirm('Start season '+(state.season+1)+'/'+(state.season+2)+'? League results will reset; your squad and transfers remain.'))return;state.season++;state.week=1;state.teams.forEach(t=>{t.points=t.played=t.w=t.d=t.l=t.gf=t.ga=0;t.rating=Math.min(94,Math.max(55,t.rating+(Math.random()*4-1.5))) });state.players.forEach(p=>{p.age++;if(p.age<24&&Math.random()<.45)p.ovr=Math.min(95,p.ovr+1);if(p.age>32&&Math.random()<.3)p.ovr=Math.max(45,p.ovr-1)});state.teams.forEach(t=>{if(t.short!==state.club)t.players=makePlayers(t,t.rating)});myTeam().players=state.players;state.fixtures=makeFixtures(state.teams.map(t=>t.short));state.table=state.teams.map(t=>({short:t.short,name:t.name,emoji:t.emoji,rating:t.rating,points:0,played:0,w:0,d:0,l:0,gf:0,ga:0}));state.playedMatches=[];state.week=1;save();page='dashboard';render();showToast('Welcome to the new season!')}
document.querySelectorAll('#nav button[data-page]').forEach(b=>b.onclick=()=>{if(page==='match'&&matchTimer)stopMatch();page=b.dataset.page;render()});
if(!load())showSetup();else render();
})();
